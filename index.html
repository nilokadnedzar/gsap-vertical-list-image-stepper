<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertical List Image Stepper</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="spacer">Scroll down</div>

  <section class="feature-section">
    <div class="text-column">
      <ul class="word-list">
        <li class="word active">Zuhören.</li>
        <li class="word">Untersuchen.</li>
        <li class="word">Planen.</li>
        <li class="word">Erklären.</li>
        <li class="word">Entscheiden.</li>
        <li class="word">Behandeln.</li>
      </ul>
    </div>

    <div class="line-track">
      <div class="line-indicator"></div>
    </div>

    <div class="image-column">
      <div class="img-wrapper">
        <img class="feature-img active" src="https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&w=1200&q=95" />
        <img class="feature-img" src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=95" />
        <img class="feature-img" src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1200&q=95" />
        <img class="feature-img" src="https://images.unsplash.com/photo-1606811841689-23dfddce3e95?auto=format&fit=crop&w=1200&q=95" />
        <img class="feature-img" src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1200&q=95" />
        <img class="feature-img" src="https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1200&q=95" />
      </div>
    </div>
  </section>

  <div class="spacer">End of the section</div>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- GSAP Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

  <script src="./main.js"></script>
</body>
</html>
